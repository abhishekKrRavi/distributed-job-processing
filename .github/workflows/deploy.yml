name: CD Pipeline - Automated Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/api-service
  WORKER_IMAGE_NAME: ${{ github.repository_owner }}/worker-service

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags/Labels) for API Service
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short
            type=ref,event=branch

      - name: Extract Metadata (Tags/Labels) for Worker Service
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API Service Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api-service/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Build and Push Worker Service Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker-service/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

  validate-and-deploy:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Validate Kube Kustomization & Manifests
        run: |
          kubectl kustomize ./k8s > ./k8s/compiled.yaml
          kubectl apply --dry-run=client -f ./k8s/compiled.yaml
