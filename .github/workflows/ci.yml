name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-quality:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven POMs & Compile Check
        run: ./mvnw clean compile -DskipTests

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: ./mvnw test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  build-jars:
    name: Build Maven Artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package Applications
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-packages
          path: |
            api-service/target/*.jar
            worker-service/target/*.jar
            common-library/target/*.jar
          retention-days: 7

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-jars
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JARs for Docker Context
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Service Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api-service/Dockerfile
          push: false
          tags: api-service:test

      - name: Build Worker Service Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker-service/Dockerfile
          push: false
          tags: worker-service:test
