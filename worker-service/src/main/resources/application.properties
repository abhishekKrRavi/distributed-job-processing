spring.application.name=worker-service

# Kafka configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:worker-group}
spring.kafka.listener.concurrency=3
spring.kafka.consumer.properties.spring.json.trusted.packages=com.platform.job.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
logging.level.org.apache.kafka=info
logging.level.org.springframework.kafka=info
logging.level.org.hibernate=warn
logging.level.org.springframework.orm.jpa=warn

# Logging
logging.level.root=INFO
logging.level.com.platform=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
spring.output.ansi.enabled=never

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/distributed_job_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
