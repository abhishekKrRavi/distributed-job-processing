name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version Tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  create-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Production Packages
        run: ./mvnw clean package -DskipTests

      - name: Rename Artifacts for Release
        run: |
          mkdir -p release-artifacts
          cp api-service/target/*.jar release-artifacts/api-service-${{ github.ref_name }}.jar
          cp worker-service/target/*.jar release-artifacts/worker-service-${{ github.ref_name }}.jar

      - name: Generate Release Notes & Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
